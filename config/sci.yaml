# Constants for the Software Carbon Intensity of one evaluated model candidate.
#   SCI = (E x I + M) / R      Green Software Foundation SCI, ISO/IEC 21031:2024
# Every value below has an entry under `sources`; modelgate/carbon.py refuses to
# load the file otherwise. docs/SCI.md explains each assumption.

functional_unit: one evaluated model candidate   # R = 1

runner:
  tag: saas-linux-small-amd64
  vcpus: 2
  memory_gb: 8
  cloud_region: us-east1
  # GitLab does not publish the machine type ("might change"). Assumed:
  assumed_machine_type: n2d-standard-2
  assumed_microarchitecture: EPYC 2nd Gen

# Passed to CodeCarbon as force_cpu_power, force_ram_power and pue, because the
# runner VM exposes no RAPL counters and CodeCarbon would otherwise charge the TDP
# of a whole host CPU socket to a 2-vCPU job.
cpu_watts_per_vcpu: 1.575      # at 100% utilization
memory_watts_per_gb: 0.392
pue: 1.1

grid_intensity_gco2e_per_kwh: 579

# The Duo flow's own cost, in GitLab Credits per run, read from the GitLab Credits dashboard
# after a real run (docs/SETUP.md, Phase 0 item 6). Credits are not energy; this is reported
# next to the SCI figures, never added to them. null until measured.
flow_credits_per_run: null

server_embodied_kgco2e: 2321.46
server_lifespan_years: 4
family_max_vcpus: 224           # n2d-standard-224, the largest n2d machine type

sources:
  runner: >-
    GitLab docs, Hosted runners on Linux: saas-linux-small-amd64 has 2 vCPUs and 8 GB,
    runs on Google Cloud Compute Engine, default region us-east1.
    https://docs.gitlab.com/ci/runners/hosted_runners/linux/
  cpu_watts_per_vcpu: >-
    Cloud Carbon Footprint coefficients, coefficients-gcp-use.csv, EPYC 2nd Gen
    "Max Watts" 1.575187 per vCPU (Apache-2.0).
    https://github.com/cloud-carbon-footprint/ccf-coefficients/blob/main/output/coefficients-gcp-use.csv
  memory_watts_per_gb: >-
    Cloud Carbon Footprint methodology: memory 0.000392 kWh per GB-hour.
    https://www.cloudcarbonfootprint.org/docs/methodology/
  pue: >-
    Cloud Carbon Footprint methodology: GCP PUE 1.1, from Google's published PUE.
    https://www.cloudcarbonfootprint.org/docs/methodology/
  grid_intensity_gco2e_per_kwh: >-
    Google Cloud, Carbon free energy for Google Cloud regions, 2025 data:
    us-east1 grid carbon intensity 579 gCO2eq/kWh (location-based, from Electricity Maps).
    https://cloud.google.com/sustainability/region-carbon
  server_embodied_kgco2e: >-
    Cloud Carbon Footprint coefficients, coefficients-gcp-embodied.csv, n2d-standard-2,
    EPYC 2nd Gen, total 2321.46 kgCO2e per server.
    https://github.com/cloud-carbon-footprint/ccf-coefficients/blob/main/output/coefficients-gcp-embodied.csv
  server_lifespan_years: >-
    Cloud Carbon Footprint embodied emissions method: 4-year expected lifespan.
    https://www.cloudcarbonfootprint.org/docs/embodied-emissions
  flow_credits_per_run: >-
    GitLab Credits dashboard, Automated flow usage for the ModelGate service account, one run.
    Not yet measured.
  family_max_vcpus: >-
    Cloud Carbon Footprint embodied emissions method: resources reserved / largest
    instance vCPUs in the family; n2d-standard-224 has 224 vCPUs.
    https://www.cloudcarbonfootprint.org/docs/embodied-emissions
